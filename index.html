<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Diri Siswa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f0f2f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: #ffffff;
      width: 100%;
      max-width: 800px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .header h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .header p {
      font-size: 14px;
      opacity: 0.9;
    }

    .content {
      display: flex;
      flex-direction: row;
      padding: 30px;
      gap: 30px;
    }

    .profile-side {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      border-right: 1px solid #eee;
      padding-right: 20px;
    }

    .avatar-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      overflow: hidden;
      border: 4px solid #2a5298;
      margin-bottom: 15px;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .btn-edit-photo {
      background-color: #2a5298;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.3s;
    }

    .btn-edit-photo:hover {
      background-color: #1e3c72;
    }

    .info-side {
      flex: 2;
    }

    .info-group {
      margin-bottom: 15px;
    }

    .info-group label {
      font-size: 12px;
      font-weight: bold;
      color: #666;
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    .info-group input, 
    .info-group select,
    .info-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      background-color: #f9f9f9;
      outline: none;
      transition: border-color 0.3s;
    }

    .info-group input:focus,
    .info-group select:focus,
    .info-group textarea:focus {
      border-color: #2a5298;
      background-color: #fff;
    }

    .info-group input[disabled],
    .info-group select[disabled],
    .info-group textarea[disabled] {
      background-color: #f0f0f0;
      border-color: transparent;
      color: #333;
    }

    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.3s;
    }

    .btn-primary {
      background-color: #2a5298;
      color: white;
    }

    .btn-success {
      background-color: #28a745;
      color: white;
      display: none;
    }

    .btn:hover {
      opacity: 0.9;
    }

    #photoInput {
      display: none;
    }

    @media (max-width: 650px) {
      .content {
        flex-direction: column;
      }
      .profile-side {
        border-right: none;
        border-bottom: 1px solid #eee;
        padding-right: 0;
        padding-bottom: 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>PROFIL DATA DIRI SISWA</h1>
      <p>Sistem Informasi Data Siswa</p>
    </div>

    <form id="studentForm" class="content">
      <div class="profile-side">
        <div class="avatar-wrapper">
          <img id="profileImage" src="https://via.placeholder.com/150" alt="Foto Siswa">
        </div>
        <input type="file" id="photoInput" accept="image/*">
        <button type="button" class="btn-edit-photo" id="btnChangePhoto" style="display: none;">Ganti Foto</button>
      </div>

      <div class="info-side">
        <div class="info-group">
          <label for="nama">Nama Lengkap</label>
          <input type="text" id="nama" value="Ahmad Rizky" disabled required>
        </div>

        <div class="info-group">
          <label for="nisn">NISN</label>
          <input type="text" id="nisn" value="0051234567" disabled required>
        </div>

        <div class="info-group">
          <label for="kelas">Kelas</label>
          <input type="text" id="kelas" value="XII IPA 1" disabled required>
        </div>

        <div class="info-group">
          <label for="gender">Jenis Kelamin</label>
          <select id="gender" disabled required>
            <option value="Laki-laki" selected>Laki-laki</option>
            <option value="Perempuan">Perempuan</option>
          </select>
        </div>

        <div class="info-group">
          <label for="tgllahir">Tanggal Lahir</label>
          <input type="date" id="tgllahir" value="2006-05-15" disabled required>
        </div>

        <div class="info-group">
          <label for="alamat">Alamat</label>
          <textarea id="alamat" rows="3" disabled required>Jl. Merdeka No. 45, Jakarta</textarea>
        </div>

        <div class="actions">
          <button type="button" id="btnEdit" class="btn btn-primary">Edit Data</button>
          <button type="submit" id="btnSave" class="btn btn-success">Simpan</button>
        </div>
      </div>
    </form>
  </div>

  <script>
    const form = document.getElementById('studentForm');
    const inputs = form.querySelectorAll('input:not(#photoInput), select, textarea');
    const btnEdit = document.getElementById('btnEdit');
    const btnSave = document.getElementById('btnSave');
    const btnChangePhoto = document.getElementById('btnChangePhoto');
    const photoInput = document.getElementById('photoInput');
    const profileImage = document.getElementById('profileImage');

    // Load data dari LocalStorage jika ada
    window.addEventListener('DOMContentLoaded', () => {
      const savedData = JSON.parse(localStorage.getItem('studentData'));
      if (savedData) {
        document.getElementById('nama').value = savedData.nama || '';
        document.getElementById('nisn').value = savedData.nisn || '';
        document.getElementById('kelas').value = savedData.kelas || '';
        document.getElementById('gender').value = savedData.gender || 'Laki-laki';
        document.getElementById('tgllahir').value = savedData.tgllahir || '';
        document.getElementById('alamat').value = savedData.alamat || '';
        if (savedData.photo) {
          profileImage.src = savedData.photo;
        }
      }
    });

    // Aktifkan mode edit
    btnEdit.addEventListener('click', () => {
      inputs.forEach(input => input.disabled = false);
      btnEdit.style.display = 'none';
      btnSave.style.display = 'inline-block';
      btnChangePhoto.style.display = 'inline-block';
    });

    // Pemicu upload foto
    btnChangePhoto.addEventListener('click', () => {
      photoInput.click();
    });

    // Preview foto yang diupload
    photoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
          profileImage.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Simpan data ke LocalStorage
    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const studentData = {
        nama: document.getElementById('nama').value,
        nisn: document.getElementById('nisn').value,
        kelas: document.getElementById('kelas').value,
        gender: document.getElementById('gender').value,
        tgllahir: document.getElementById('tgllahir').value,
        alamat: document.getElementById('alamat').value,
        photo: profileImage.src
      };

      localStorage.setItem('studentData', JSON.stringify(studentData));

      // Nonaktifkan field
      inputs.forEach(input => input.disabled = true);
      btnEdit.style.display = 'inline-block';
      btnSave.style.display = 'none';
      btnChangePhoto.style.display = 'none';

      alert('Data berhasil disimpan!');
    });
  </script>
</body>
</html>
